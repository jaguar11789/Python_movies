{% extends 'frame.html' %}
{% load static %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <h2 class="text-center mb-4">회원가입</h2>

            <form method="post" action="{% url 'accounts:signup' %}">
                {% csrf_token %}

                <!-- 아이디 -->
                <div class="mb-3">
                    <label for="userId" class="form-label">아이디</label>
                    <input type="text" class="form-control" id="userId" name="userId" autocomplete="off" placeholder="아이디를 입력하세요." required>
                    <span id="id_ok" class="id_ok">사용 가능한 아이디입니다.</span>
                    <span id="id_already" class="id_already">중복된 아이디입니다.</span>
                </div>

                <!-- 비밀번호 -->
                <div class="mb-3">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요." required>
                </div>

                <!-- 비밀번호 확인 -->
                <div class="mb-3">
                    <label for="userPwdCheck" class="form-label">비밀번호 확인</label>
                    <input type="password" class="form-control" id="userPwdCheck" placeholder="비밀번호를 다시 입력하세요." required>

                    <div class="pwd_ok text-success mt-1">
                        비밀번호가 일치합니다.
                    </div>

                    <div class="pwd_no text-danger mt-1">
                        비밀번호가 일치하지 않습니다.
                    </div>
                </div>

                <!-- 이름 -->
                <div class="mb-3">
                    <label for="name" class="form-label">이름</label>
                    <input
                        type="text" class="form-control" id="name" name="name" placeholder="이름을 입력하세요." required>
                </div>

                <!-- 이메일 -->
                <div class="mb-3">
                    <label for="email" class="form-label">이메일</label>
                    <input
                        type="email" class="form-control" id="email" name="email" placeholder="이메일을 입력하세요." required>
                </div>

                <!-- 성별 -->
                <div class="mb-3">
                    <label for="gender" class="form-label">성별</label>
                    <select
                        id="gender" name="gender" class="form-select" required>
                        <option value="">성별을 선택하세요.</option>
                        <option value="m">남성</option>
                        <option value="f">여성</option>
                    </select>
                </div>

                <!-- 생년월일 -->
                <div class="mb-3">
                    <label for="birth_date" class="form-label">생년월일</label>
                    <input type="date" class="form-control" id="birth_date" name="birth_date" required>
                </div>

                <!-- 전화번호 -->
                <div class="mb-3">
                    <label for="telnum" class="form-label">전화번호</label>
                    <input type="tel" class="form-control" id="telnum" name="telnum" placeholder="전화번호를 입력하세요. (- 제외)" required>
                </div>

                <!-- 주소 -->
                <div class="mb-3">
                    <label class="form-label">주소</label>

                    <div class="input-group mb-2">
                        <input type="text" class="form-control" id="zipcode" name="zipcode" placeholder="우편번호" readonly required>
                        <button type="button" onclick="addr_search();" class="btn btn-outline-secondary">주소검색</button>
                    </div>

                    <input type="text" class="form-control mb-2" id="base_addr" name="base_addr" placeholder="기본주소" readonly required>

                    <input type="text" class="form-control" id="dtl_addr" name="dtl_addr" placeholder="상세주소를 입력하세요." required>
                </div>

                <!-- 버튼 -->
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary flex-fill" onclick="return confirm('입력하신 정보로 회원가입 하시겠습니까?');">가입하기</button>
                    <button type="button" class="btn btn-secondary flex-fill" onclick="location.href='{% url 'movies:index' %}'">취소</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% if signup_success %}
<script>
    alert('회원가입이 완료되었습니다.');
    location.href = "{% url 'accounts:login' %}";
</script>
{% endif %}
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="{% static 'js/accounts/accounts.js' %}"></script>
<link rel="stylesheet" href="{% static 'css/accounts/signup.css' %}">
{% endblock %}
