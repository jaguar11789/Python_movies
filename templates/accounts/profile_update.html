{% extends 'frame.html' %}
{% load static %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <h2 class="text-center mb-4">회원정보 수정</h2>

            <form method="post" action="{% url 'accounts:profile_update' %}">
                {% csrf_token %}

                <!-- 아이디 -->
                <div class="mb-3">
                    <label for="userId" class="form-label">아이디</label>
                    <input type="text" class="form-control" id="userId" name="userId" autocomplete="off" value="{{ user.username }}" readonly>
                </div>

                <!-- 이름 -->
                <div class="mb-3">
                    <label for="name" class="form-label">이름</label>
                    <input
                        type="text" class="form-control" id="name" name="name" value="{{ profile.name }}" required>
                </div>

                <!-- 이메일 -->
                <div class="mb-3">
                    <label for="email" class="form-label">이메일</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                </div>

                <!-- 성별 -->
                <div class="mb-3">
                    <label for="gender" class="form-label">성별</label>
                    <select class="form-select" id="gender" name="gender" required>
                        <option value="m" {% if profile.gender == 'm' %}selected{% endif %}>남성</option>
                        <option value="f" {% if profile.gender == 'f' %}selected{% endif %}>여성</option>
                    </select>
                </div>

                <!-- 생년월일 -->
                <div class="mb-3">
                    <label for="birth_date" class="form-label">생년월일</label>
                    <input type="date" class="form-control" id="birth_date" name="birth_date" value="{{ profile.birth_date|date:'Y-m-d' }}" required>
                </div>

                <!-- 전화번호 -->
                <div class="mb-3">
                    <label for="telnum" class="form-label">전화번호</label>
                    <input type="tel" class="form-control" id="telnum" name="telnum" value="{{ profile.telnum }}" required>
                </div>

                <!-- 주소 -->
                <div class="mb-3">
                    <label class="form-label">주소</label>

                    <div class="input-group mb-2">
                        <input type="text" class="form-control" id="zipcode" name="zipcode" placeholder="우편번호" value="{{ profile.zipcode }}" readonly required>
                        <button type="button" onclick="addr_search();" class="btn btn-outline-secondary">주소검색</button>
                    </div>

                    <input type="text" class="form-control mb-2" id="base_addr" name="base_addr" placeholder="기본주소" value="{{ profile.base_addr }}" readonly required>

                    <input type="text" class="form-control" id="dtl_addr" name="dtl_addr" value="{{ profile.dtl_addr }}" required>
                </div>

                <!-- 버튼 -->
                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary flex-fill" onclick="return confirm('입력하신 정보로 수정 하시겠습니까?');">회원정보 수정</button>
                    <button type="button" class="btn btn-secondary flex-fill" onclick="location.href='{% url 'accounts:mypage' %}'">취소</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<script src="{% static 'js/accounts/signup.js' %}"></script>
<link rel="stylesheet" href="{% static 'css/accounts/signup.css' %}">
{% endblock %}
