{% extends 'frame.html' %}
{% load static %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <h2 class="text-center mb-4">비밀번호 수정</h2>
            {% csrf_token %}

            <div class="mb-3">
                <label for="current_password" class="form-label">현재 비밀번호</label>
                <input type="password" class="form-control" id="current_password" name="current_password" placeholder="현재 비밀번호를 입력하세요." required>
            </div>
            {% if error %}
                <div class="text-danger mt-1">
                    {{ error }}
                </div>
            {% endif %}
            <!-- 비밀번호 -->
            <div class="mb-3">
                <label for="password" class="form-label">새 비밀번호</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="새 비밀번호를 입력하세요." required>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="mb-3">
                <label for="userPwdCheck" class="form-label">새 비밀번호 확인</label>
                <input type="password" class="form-control" id="userPwdCheck" placeholder="비밀번호를 다시 입력하세요." required>

                <div class="pwd_ok text-success mt-1">
                    비밀번호가 일치합니다.
                </div>

                <div class="pwd_no text-danger mt-1">
                    비밀번호가 일치하지 않습니다.
                </div>
            </div>
            <!-- 버튼 -->
            <div class="d-flex gap-2 mt-4">
                <button type="button" class="btn btn-primary flex-fill" onclick="passwordUpdate();">비밀번호 수정</button>
                <button type="button" class="btn btn-secondary flex-fill" onclick="location.href='{% url 'accounts:mypage' %}'">취소</button>
            </div>
        </div>
    </div>
</div>
<script>
    const passwordUpdateUrl = "{% url 'accounts:password_update' %}";
    const csrfToken = "{{ csrf_token }}";
    const loginUrl = "{% url 'accounts:login' %}"
</script>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="{% static 'js/accounts/passwordupdate.js' %}"></script>
<link rel="stylesheet" href="{% static 'css/accounts/signup.css' %}">
{% endblock %}
